[package]
name = "ahrara-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Ahrara SMTP and authenticated WebSocket server"

[features]
tunnel = ["dep:h2", "dep:libcfd-rpc", "dep:tokio-tungstenite", "futures-util/io", "tokio-util/compat"]

[dependencies]
anyhow = "1.0"
axum = { version = "=0.8.9", features = ["ws"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
ed25519-dalek = "2.2"
futures-util = { version = "0.3", features = ["sink"] }
h2 = { version = "0.4", optional = true }
hex = "0.4"
hyper-util = { version = "0.1", features = ["tokio"] }
ipnet = "2.11"
libcfd-rpc = { version = "=0.2.0", optional = true }
mailparse = { path = "../third_party/mailparse" }
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
snow = { version = "=0.10.0", default-features = false, features = ["ring-accelerated", "use-curve25519", "use-chacha20poly1305", "use-sha2"] }
smtp-proto = "=0.2.4"
tokio = { version = "1.47", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"], optional = true }
tokio-util = "0.7"
zeroize = "1.8"

[dev-dependencies]
tokio = { version = "1.47", features = ["test-util"] }

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
