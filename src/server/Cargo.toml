[package]
name = "ahrara-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Ahrara SMTP and authenticated WebSocket server"

[features]
tunnel = ["dep:libcfd", "dep:tokio-tungstenite", "dep:tracing", "tokio-util/compat"]

[dependencies]
anyhow = "1.0"
axum = { version = "=0.8.9", features = ["ws"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
bytes = "1.12"
ed25519-dalek = "2.2"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
hyper-util = { version = "0.1", features = ["tokio"] }
ipnet = "2.11"
libcfd = { version = "0.2.0", path = "third_party/libcfd", default-features = false, features = ["named-tunnel", "h2-edge", "axum-origin"], optional = true }
mailparse = { path = "../third_party/mailparse" }
memchr = "2.7"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
snow = { version = "=0.10.0", default-features = false, features = ["ring-accelerated", "use-curve25519", "use-chacha20poly1305", "use-sha2"] }
smtp-proto = "=0.2.4"
tokio = { version = "1.47", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, optional = true }
tokio-util = "0.7"
tracing = { version = "=0.1.44", default-features = false, optional = true, features = ["std"] }
zeroize = "1.8"

[dev-dependencies]
tokio = { version = "1.47", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
