[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ahrara"
version = "0.1.0"
description = "Disposable email inboxes powered by the shared Ahrara Rust core"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ahrara contributors" }]
keywords = ["email", "disposable email", "testing", "qa", "automation", "robot framework"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Testing",
    "Framework :: Robot Framework :: Library",
]

[project.urls]
Homepage = "https://ahrara.dev"
Documentation = "https://ahrara.dev/docs/"
Source = "https://github.com/Hitmasu/Ahrara"
Issues = "https://github.com/Hitmasu/Ahrara/issues"

[project.optional-dependencies]
test = ["pytest>=8", "robotframework>=7", "build>=1", "black>=25", "mypy>=1"]

[tool.setuptools]
packages = ["ahrara"]

[tool.setuptools.package-data]
ahrara = ["native/*", "py.typed"]
