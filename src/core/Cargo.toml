[package]
name = "ahrara-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Embeddable Ahrara receiver shared by the CLI and language SDKs"
license = "MIT"
repository = "https://github.com/Hitmasu/Ahrara"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
schemars = "1.0"
ammonia = "=4.2.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cssparser = { version = "=0.38.0", default-features = false }
directories = "6.0"
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
hkdf = "=0.12.4"
html5ever = "=0.40.1"
# RcDom currently implements the 0.39 TreeSink; keep the sanitizer's newer pin.
html5ever_xpath = { package = "html5ever", version = "=0.39.0" }
markup5ever_rcdom = "=0.39.0"
mailparse = "0.16"
regex = "1.13"
sxd-document = "0.3.2"
sxd-xpath = "0.4.2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
snow = { version = "=0.10.0", default-features = false, features = ["ring-accelerated", "use-curve25519", "use-chacha20poly1305", "use-sha2"] }
tempfile = "3.23"
tokio = { version = "1.47", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
toml = "0.9"
utoipa = { version = "5.4", features = ["axum_extras", "yaml"] }
webpki-roots = "1.0"
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Authorization"] }

[patch.crates-io]
mailparse = { path = "../third_party/mailparse" }

[dev-dependencies]
axum = "0.8"

[profile.dev]
debug = 0

[profile.test]
debug = 0
