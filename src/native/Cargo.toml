[package]
name = "ahrara-native"
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "C ABI for the embedded Ahrara Rust receiver"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ahrara-core = { path = "../core", version = "0.0.1" }
anyhow = "1.0"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["rt-multi-thread"] }
zeroize = "1.8"

[patch.crates-io]
mailparse = { path = "../third_party/mailparse" }

# Size over speed: every SDK package ships this library for six platforms, and
# the SDKs mostly wait on the network. Measured on Linux x64: 14% smaller, no
# slower; the npm and NuGet packages shrink 7%.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
