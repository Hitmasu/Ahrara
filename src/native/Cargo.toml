[package]
name = "ahrara-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "C ABI for the embedded Ahrara Rust receiver"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ahrara-core = { path = "../core", version = "0.1.0" }
anyhow = "1.0"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["rt-multi-thread"] }

[patch.crates-io]
mailparse = { path = "../third_party/mailparse" }

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
