<header class="topbar"><div class="current-address">{% if default_address.is_empty() %}<a class="button primary" href="/addresses#create-address">{{ t.create_address }}</a>{% else %}<button class="address-copy" type="button" data-copy="{{ default_address }}" title="{{ t.copy_your_address }}"><span>{{ default_address }}</span><svg><use href="#copy"/></svg></button>{% endif %}</div>{% if let Mode::Cli(settings) = mode %}{% if settings.password %}<form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="button secondary">{{ t.sign_out }}</button></form>{% endif %}{% endif %}</header>
