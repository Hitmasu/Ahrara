<tr><td class="sender-cell"><span class="sender-initial" aria-hidden="true">{{ row.from.chars().next().unwrap_or('?') }}</span><span class="truncate">{{ row.from }}</span></td><td class="subject-cell"><a href="/emails/{{ row.id }}">{{ row.subject }}</a></td><td class="received-column">{{ row.received }}</td><td class="address-column"><span class="truncate address-text" title="{{ row.recipient }}">{{ row.recipient }}</span></td><td class="size-column">{{ row.size }}</td><td><form method="post" action="/emails/{{ row.id }}/delete" data-confirm="{{ t.confirm_delete_email }}"><input type="hidden" name="csrf" value="{{ csrf }}"><noscript><label class="check"><input type="checkbox" name="confirm" value="true" required>{{ t.confirm_action }}</label></noscript><button class="icon-button danger" aria-label="{{ t.delete }} {{ row.subject }}" title="{{ t.delete_email }}"><svg><use href="#delete"/></svg></button></form></td></tr>
