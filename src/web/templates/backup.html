<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Save your Recovery Key · Ahrara</title><link rel="icon" href="/assets/logo.png"><link rel="stylesheet" href="/assets/app.css"><script src="/assets/app.js" defer></script></head><body class="login-page" data-events="broadcast"><main class="login"><a class="brand" href="/"><img src="/assets/logo.png" width="56" height="56" alt=""><span>Ahrara<small>Simple. Private. Yours.</small></span></a><h1>Save your Recovery Key</h1><p class="muted">It is the only way to open these addresses in another browser or in the Ahrara CLI. Anyone with it can receive your email, so keep it private.</p><p class="fingerprint"><code>{{ recovery.as_str() }}</code></p><button type="button" class="button secondary" data-copy="{{ recovery.as_str() }}" data-copied="Recovery Key copied">Copy Recovery Key</button><form action="/backup" method="post" data-persist><input type="hidden" name="csrf" value="{{ csrf }}"><label class="check"><input type="checkbox" name="confirm" value="true" required>I saved my Recovery Key somewhere safe</label><button class="button primary">Continue</button></form></main></body></html>
