<!doctype html><html lang="{{ t.code }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ t.backup_title }} · Ahrara</title><link rel="icon" href="/assets/logo.png"><link rel="stylesheet" href="/assets/app.css"><script src="/assets/app.js" defer></script></head><body class="login-page" data-events="broadcast" data-strings="{{ t.script() }}"><main class="login"><a class="brand" href="/"><img src="/assets/logo.png" width="56" height="56" alt=""><span>Ahrara<small>{{ t.tagline }}</small></span></a><h1>{{ t.backup_title }}</h1><p class="muted">{{ t.backup_detail }}</p><p class="fingerprint"><code>{{ recovery.as_str() }}</code></p><button type="button" class="button secondary" data-copy="{{ recovery.as_str() }}" data-copied="{{ t.recovery_copied }}">{{ t.copy_recovery_key }}</button><form action="/backup" method="post" data-persist><input type="hidden" name="csrf" value="{{ csrf }}"><label class="check"><input type="checkbox" name="confirm" value="true" required>{{ t.backup_confirm }}</label><button class="button primary">{{ t.proceed }}</button></form></main></body></html>
