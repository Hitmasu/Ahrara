<!doctype html><html lang="{{ t.code }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ t.welcome }} · Ahrara</title><link rel="icon" href="/assets/logo.png"><link rel="stylesheet" href="/assets/app.css"><script src="/assets/app.js" defer></script></head><body class="login-page" data-events="broadcast" data-strings="{{ t.script() }}"><main class="login"><a class="brand" href="/"><img src="/assets/logo.png" width="56" height="56" alt=""><span>Ahrara<small>{{ t.tagline }}</small></span></a><h1>{{ t.welcome_heading }}</h1><p class="muted">{{ t.welcome_detail }}</p>{% if error %}<p role="alert" class="warning">{{ t.invalid_recovery_key }}</p>{% endif %}<form action="/welcome" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="action" value="create"><button class="button primary">{{ t.create_identity }}</button></form><form action="/welcome" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="action" value="import"><label>{{ t.recovery_key }}<input type="password" name="recovery_key" autocomplete="off" spellcheck="false" maxlength="128" required></label><button class="button secondary">{{ t.import_recovery_key }}</button></form><p class="login-footer">{{ t.welcome_cli }} <code>ahrara auth export</code> {{ t.welcome_cli_after }}</p></main></body></html>
