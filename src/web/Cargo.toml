[package]
name = "ahrara-web"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "Ahrara's Web UI, served by the CLI's local server and by the browser app"
license = "MIT"
repository = "https://github.com/Hitmasu/Ahrara"

[dependencies]
ahrara-core = { path = "../core", version = "0.2.0" }
anyhow = "1.0"
askama = "=0.14.0"
http = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
subtle = "2.6"
zeroize = "1.8"

# The browser app: a Service Worker and a worker drive this crate through wasm-bindgen.
[target.'cfg(target_arch = "wasm32")'.dependencies]
chacha20poly1305 = "0.10"
chrono = "0.4"
hex = "0.4"
js-sys = "0.3"
rand = "0.8"
sha2 = "0.10"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[patch.crates-io]
mailparse = { path = "../third_party/mailparse" }

# Download size matters more than speed for the browser build.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[profile.dev]
debug = 0

[profile.test]
debug = 0
