<!doctype html><html lang="{{ t.code }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ t.sign_in }} · Ahrara</title><link rel="icon" href="/assets/logo.png"><link rel="stylesheet" href="/assets/app.css"></head><body class="login-page"><main class="login"><a class="brand" href="/"><img src="/assets/logo.png" width="56" height="56" alt=""><span>Ahrara</span></a><h1>{{ t.login_heading }}</h1><p class="muted">{{ t.login_detail }}</p>{% if error %}<p role="alert" class="warning">{{ t.login_error }}</p>{% endif %}<form action="/login" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>{{ t.password }}<input type="password" name="password" autocomplete="current-password" maxlength="1024" autofocus required></label><button class="button primary">{{ t.sign_in }}</button></form><p class="login-footer">{{ t.forgot_password }}</p></main></body></html>
