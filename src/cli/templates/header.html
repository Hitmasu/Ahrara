<header class="topbar"><div class="current-address">{% if default_address.is_empty() %}<a class="button primary" href="/addresses#create-address">Create address</a>{% else %}<button class="address-copy" type="button" data-copy="{{ default_address }}" title="Copy your email address"><span>{{ default_address }}</span><svg><use href="#copy"/></svg></button>{% endif %}</div>{% if settings.password_hash.is_some() %}<form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="button secondary">Sign out</button></form>{% endif %}</header>
