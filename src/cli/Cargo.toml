[package]
name = "ahrara"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Disposable email with a local inbox for developers and AI agents"
license = "MIT"
repository = "https://github.com/Hitmasu/Ahrara"
homepage = "https://ahrara.dev"

[dependencies]
ahrara-core = { path = "../core", version = "0.1.0" }
ahrara-web = { path = "../web", version = "0.1.0" }
anyhow = "1.0"
argon2 = "=0.5.3"
askama = "=0.14.0"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
async-stream = "0.3"
axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
console = "0.16"
crossterm = { version = "0.29", default-features = false, features = ["events", "event-stream", "windows", "bracketed-paste", "osc52"] }
directories = "6.0"
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
rmcp = { version = "=3.5.1", features = ["server", "client", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
# rmcp's HTTP client needs reqwest 0.13; drop this alias once the CLI moves off 0.12.
rmcp-reqwest = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rpassword = "7.4"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
self-replace = "=1.5.0"
semver = { version = "1.0", features = ["serde"] }
sha2 = "0.10"
subtle = "2.6"
tempfile = "3.23"
tokio = { version = "1.47", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
utoipa = { version = "5.4", features = ["axum_extras", "yaml"] }
zeroize = "1.8"

[patch.crates-io]
mailparse = { path = "../third_party/mailparse" }

[dev-dependencies]
rcgen = "=0.14.5"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
