name: Client release
on:
  # Every pushed version tag (vX.Y.Z) publishes a release; the tag must match src/cli/Cargo.toml.
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Stable version matching src/cli/Cargo.toml (without v)
        required: true
      initial_release:
        description: First publication only (there is no previous signed manifest)
        type: boolean
        default: false
      available:
        description: Already published channel=platform pairs, separated by spaces
        default: ''
permissions:
  contents: read
concurrency:
  group: client-release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, darwin, windows]
        arch: [x86_64, aarch64]
    runs-on: ubuntu-latest
    env:
      AHRARA_UPDATE_PUBLIC_KEY: ${{ vars.AHRARA_UPDATE_PUBLIC_KEY }}
      AHRARA_SERVER_PUBLIC_KEY: ${{ vars.AHRARA_SERVER_PUBLIC_KEY }}
      RELEASE_REF: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Resolve release version
        shell: bash
        run: echo "RELEASE_VERSION=${RELEASE_REF#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, re, tomllib
          from pathlib import Path
          assert re.fullmatch(r'[0-9a-fA-F]{64}', os.environ['AHRARA_UPDATE_PUBLIC_KEY']), 'Configure the public release key first'
          assert os.environ['RELEASE_VERSION'] == tomllib.loads(Path('src/cli/Cargo.toml').read_text())['package']['version'], 'Version mismatch'
          pin = os.environ['AHRARA_SERVER_PUBLIC_KEY']
          assert re.fullmatch(r'ahrara_server_v1_[A-Za-z0-9_-]{43}', pin), 'Configure the verified public relay transport key first'
          raw = base64.urlsafe_b64decode(pin.removeprefix('ahrara_server_v1_') + '=')
          assert len(raw) == 32 and base64.urlsafe_b64encode(raw).decode().rstrip('=') == pin.removeprefix('ahrara_server_v1_'), 'Invalid relay public key'
          PY
      - name: Build client
        run: make release PLATFORM=${{ matrix.platform }} ARCH=${{ matrix.arch }}
      # Includes the plugin tests, which check every plugin manifest against src/cli/Cargo.toml.
      - name: Validate updater and client on Linux
        if: matrix.platform == 'linux' && matrix.arch == 'x86_64'
        run: make client-lint client-test
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/ahrara-*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_REF: ${{ inputs.version || github.ref_name }}
      AHRARA_UPDATE_PUBLIC_KEY: ${{ vars.AHRARA_UPDATE_PUBLIC_KEY }}
      AVAILABLE: ${{ inputs.available }}
      INITIAL_RELEASE: ${{ inputs.initial_release }}
    steps:
      - name: Resolve release version
        shell: bash
        run: echo "RELEASE_VERSION=${RELEASE_REF#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: client-*
          path: dist
          merge-multiple: true
      - name: Generate signed static manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.AHRARA_RELEASE_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Tag pushes have no inputs: only the first release lacks a previous signed manifest.
          if [ -z "$INITIAL_RELEASE" ]; then
            INITIAL_RELEASE=$([ "$(gh release list --limit 1 --json tagName --jq length)" = 0 ] && echo true || echo false)
          fi
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$RELEASE_SIGNING_KEY" > "$key_file"
          unset RELEASE_SIGNING_KEY
          umask 022
          args=()
          if [ "$INITIAL_RELEASE" != true ]; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://ahrara.dev/releases/stable.json -o previous.json
            args+=(--previous previous.json)
          fi
          read -r -a availability <<< "$AVAILABLE"
          for entry in "${availability[@]}"; do args+=(--available "$entry"); done
          python3 scripts/release-manifest.py --version "$RELEASE_VERSION" --assets dist \
            --key "$key_file" --public-key "$AHRARA_UPDATE_PUBLIC_KEY" \
            --output src/site/releases/stable.json --homebrew-output Formula/ahrara.rb \
            --plugin-key-output src/plugin/release-key.json "${args[@]}"
      - name: Prepare plugin verification key for review and commit
        uses: actions/upload-artifact@v4
        with:
          name: ahrara-plugin-key
          path: src/plugin/release-key.json
          if-no-files-found: error
      - name: Prepare formula for review and commit to this repository
        uses: actions/upload-artifact@v4
        with:
          name: ahrara-homebrew-formula
          path: Formula/ahrara.rb
          if-no-files-found: error
      - name: Publish binaries and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo 'Release exists; use the documented manifest refresh procedure. Binaries are immutable.' >&2
            exit 1
          fi
          gh release create "v$RELEASE_VERSION" --target "$GITHUB_SHA" \
            --title "Ahrara $RELEASE_VERSION" --generate-notes \
            dist/ahrara-* src/site/releases/stable.json Formula/ahrara.rb
      - name: Prepare static site for its existing hosting pipeline
        uses: actions/upload-artifact@v4
        with:
          name: ahrara-static-site
          path: src/site/
          if-no-files-found: error
