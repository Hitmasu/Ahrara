name: Client release
on:
  # Every pushed version tag (vX.Y.Z) publishes a release; the tag must match src/cli/Cargo.toml.
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Stable version matching src/cli/Cargo.toml (without v)
        required: true
      initial_release:
        description: First publication only (there is no previous signed manifest)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: client-release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, darwin, windows]
        arch: [x86_64, aarch64]
    runs-on: ubuntu-latest
    env:
      # A dedicated Ed25519 release key, never a user Identity; src/plugin/release-key.json holds the same key.
      AHRARA_UPDATE_PUBLIC_KEY: ${{ vars.AHRARA_UPDATE_PUBLIC_KEY }}
      AHRARA_SERVER_PUBLIC_KEY: ${{ vars.AHRARA_SERVER_PUBLIC_KEY }}
      RELEASE_REF: ${{ inputs.version || github.ref_name }}
    steps:
      # Every other job needs this one, so checking the input here keeps it out of all $GITHUB_ENV files.
      - name: Resolve release version
        shell: bash
        run: |
          [[ $RELEASE_REF =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $RELEASE_REF" >&2; exit 1; }
          echo "RELEASE_VERSION=${RELEASE_REF#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate release configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, re, tomllib
          from pathlib import Path
          assert re.fullmatch(r'[0-9a-fA-F]{64}', os.environ['AHRARA_UPDATE_PUBLIC_KEY']), 'Configure the public release key first'
          assert os.environ['RELEASE_VERSION'] == tomllib.loads(Path('src/cli/Cargo.toml').read_text())['package']['version'], 'Version mismatch'
          pin = os.environ['AHRARA_SERVER_PUBLIC_KEY']
          assert re.fullmatch(r'ahrara_server_v1_[A-Za-z0-9_-]{43}', pin), 'Configure the verified public relay transport key first'
          raw = base64.urlsafe_b64decode(pin.removeprefix('ahrara_server_v1_') + '=')
          assert len(raw) == 32 and base64.urlsafe_b64encode(raw).decode().rstrip('=') == pin.removeprefix('ahrara_server_v1_'), 'Invalid relay public key'
          PY
      - name: Build client
        run: make release PLATFORM=${{ matrix.platform }} ARCH=${{ matrix.arch }}
      - name: Build the SDKs' native core
        run: make sdk-native-release PLATFORM=${{ matrix.platform }} ARCH=${{ matrix.arch }}
      # Includes the plugin tests, which check every plugin and SDK manifest against src/cli/Cargo.toml.
      - name: Validate updater and client on Linux
        if: matrix.platform == 'linux' && matrix.arch == 'x86_64'
        run: make client-lint client-test
      - name: Collect third-party licenses
        if: matrix.platform == 'linux' && matrix.arch == 'x86_64'
        run: make licenses
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/ahrara-*
          if-no-files-found: error
  sdk-packages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: client-*
          path: dist
          merge-multiple: true
      - name: Package the SDKs with the six native libraries
        run: make sdk-packages
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-npm
          path: dist/packages/npm/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-python
          path: dist/packages/pypi/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-nuget
          path: dist/packages/nuget/*.nupkg
          if-no-files-found: error
      - name: Package the CLI for npm
        run: make npm-cli
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-npm
          path: dist/packages/npm-cli/*.tgz
          if-no-files-found: error
  # Runs each binary and loads each native library on its own platform before anything is published.
  smoke:
    needs: [build, sdk-packages]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux, arch: x86_64, python: x64 }
          - { runner: ubuntu-24.04-arm, platform: linux, arch: aarch64, python: arm64 }
          - { runner: macos-15-intel, platform: darwin, arch: x86_64, python: x64 }
          - { runner: macos-15, platform: darwin, arch: aarch64, python: arm64 }
          - { runner: windows-2025, platform: windows, arch: x86_64, python: x64 }
          - { runner: windows-11-arm, platform: windows, arch: aarch64, python: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_REF: ${{ inputs.version || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: client-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sdk-python
          path: wheels
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-npm
          path: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Run the CLI
        run: |
          binary=dist/ahrara-${{ matrix.platform }}-${{ matrix.arch }}
          [ -f "$binary" ] || binary=$binary.exe
          chmod +x "$binary"
          test "$("$binary" --version)" = "ahrara ${RELEASE_REF#v}"
      # Laid out as npm installs it: the launcher and this platform's package.
      - name: Run the CLI through its npm launcher
        run: |
          os=${{ matrix.platform }}; os=${os/windows/win32}
          cpu=${{ matrix.arch }}; cpu=${cpu/x86_64/x64}; cpu=${cpu/aarch64/arm64}
          version=${RELEASE_REF#v}
          mkdir -p node_modules/ahrara "node_modules/@ahrara/cli-$os-$cpu"
          tar -xzf "npm/ahrara-$version.tgz" -C node_modules/ahrara --strip-components=1
          tar -xzf "npm/ahrara-cli-$os-$cpu-$version.tgz" -C "node_modules/@ahrara/cli-$os-$cpu" --strip-components=1
          test "$(node node_modules/ahrara/bin/ahrara.js --version)" = "ahrara $version"
      # pip picks the wheel by platform tag; the core's own argument check proves the library loads with ABI 1.
      - name: Load the native core from its wheel
        run: |
          python -m pip install --quiet --no-index --find-links wheels ahrara
          python - <<'PY'
          from ahrara import _native
          try:
              _native.call({})
          except _native.AhraraError as error:
              assert error.code == "invalid_argument", error.code
          else:
              raise AssertionError("the native core accepted an empty request")
          PY
  # The manifest announces npm releases, so the packages are published before it is signed.
  npm-cli:
    needs: smoke
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_REF: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-npm
          path: npm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      # Trusted publishing first, NPM_TOKEN only for a package's first version.
      # Platform packages go first, so the launcher never points at missing ones.
      - name: Publish the CLI to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=${RELEASE_REF#v}
          for tarball in npm/ahrara-cli-*-"$version".tgz "npm/ahrara-$version.tgz"; do
            name=$(tar -xzOf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).name')
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name $version is already published"
            else
              npm publish "$tarball" --access public --provenance
            fi
          done
  publish:
    needs: [build, smoke, npm-cli]
    runs-on: ubuntu-latest
    # The signing key is a secret of this protected environment, never of the repository.
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_REF: ${{ inputs.version || github.ref_name }}
      AHRARA_UPDATE_PUBLIC_KEY: ${{ vars.AHRARA_UPDATE_PUBLIC_KEY }}
      INITIAL_RELEASE: ${{ inputs.initial_release }}
    steps:
      - name: Resolve release version
        shell: bash
        run: echo "RELEASE_VERSION=${RELEASE_REF#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: client-*
          path: dist
          merge-multiple: true
      - name: Generate signed static manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.AHRARA_RELEASE_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Tag pushes have no inputs: only the first release lacks a previous signed manifest.
          if [ -z "$INITIAL_RELEASE" ]; then
            INITIAL_RELEASE=$([ "$(gh release list --limit 1 --json tagName --jq length)" = 0 ] && echo true || echo false)
          fi
          umask 077
          key_file=$(mktemp)
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$RELEASE_SIGNING_KEY" > "$key_file"
          unset RELEASE_SIGNING_KEY
          umask 022
          args=()
          if [ "$INITIAL_RELEASE" != true ]; then
            gh release download --pattern stable.json --output previous.json
            args+=(--previous previous.json)
          fi
          # npm is published and the homebrew job commits the formula, so both channels announce it.
          for target in linux-x86_64 linux-aarch64 darwin-x86_64 darwin-aarch64; do
            args+=(--available "brew=$target" --available "npm=$target")
          done
          args+=(--available npm=windows-x86_64 --available npm=windows-aarch64)
          python3 scripts/release-manifest.py --version "$RELEASE_VERSION" --assets dist \
            --key "$key_file" --public-key "$AHRARA_UPDATE_PUBLIC_KEY" \
            --output dist/stable.json --homebrew-output Formula/ahrara.rb \
            --plugin-key-output src/plugin/release-key.json "${args[@]}"
      # Plugins install from the default branch, which must already trust this key.
      - name: Check the plugin trusts the release key
        run: git diff --exit-code -- src/plugin/release-key.json
      - name: Keep the formula for the homebrew job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ahrara-homebrew-formula
          path: Formula/ahrara.rb
          if-no-files-found: error
      - name: Publish binaries and manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo 'Release exists; binaries are immutable, so publish a new version.' >&2
            exit 1
          fi
          gh release create "v$RELEASE_VERSION" --target "$GITHUB_SHA" \
            --title "Ahrara $RELEASE_VERSION" --generate-notes \
            dist/ahrara-* dist/stable.json Formula/ahrara.rb
  # The tap is this repository, so Homebrew sees the release once the formula is on main.
  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ahrara-homebrew-formula
          path: Formula
      - name: Commit the formula to main
        env:
          RELEASE_REF: ${{ inputs.version || github.ref_name }}
        run: |
          if git diff --quiet -- Formula/ahrara.rb; then
            echo 'Formula/ahrara.rb is already up to date'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m "Homebrew formula for Ahrara ${RELEASE_REF#v}" Formula/ahrara.rb
          git push origin HEAD:main
  # The scripts read the manifest of the latest release, which is now this one.
  installers:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_REF: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Resolve the release version
        shell: bash
        run: echo "RELEASE_VERSION=${RELEASE_REF#v}" >> "$GITHUB_ENV"
      - name: Install with install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh src/site/install.sh
          test "$("$HOME/.ahrara/bin/ahrara" --version)" = "ahrara $RELEASE_VERSION"
          grep -Eq '"method": *"sh"' "$HOME/.ahrara/bin/ahrara.install.json"
      - name: Install with install.ps1 in Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-Content -Raw src/site/install.ps1 | Invoke-Expression
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Ahrara\ahrara.exe'
          $version = & $exe --version
          if ($version -ne "ahrara $env:RELEASE_VERSION") { throw "Unexpected version: $version" }
          if ((Get-Content -Raw "$exe.install.json") -notmatch '"method":\s*"powershell"') { throw 'Missing powershell receipt' }
  sdk-publish:
    needs: smoke
    runs-on: ubuntu-latest
    # NuGet, PyPI and npm trust this workflow and environment through OIDC
    # (id-token). NPM_TOKEN only bootstraps npm's first version.
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_REF: ${{ inputs.version || github.ref_name }}
    steps:
      # One directory per artifact: the PyPI action uploads everything in its directory.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sdk-*
          path: packages
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      # Every step skips versions already published, so a failed run can be re-run.
      # The short-lived key lasts an hour, so it is requested right before the push.
      - name: Get a NuGet API key
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          # The nuget.org profile name that owns Ahrara, not its email.
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: dotnet nuget push packages/sdk-nuget/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      # Checks the metadata, uploads with attestations and skips existing files.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: packages/sdk-python/
          skip-existing: true
      # npm tries trusted publishing first and falls back to NPM_TOKEN, which only the
      # first version needs: npm configures trusted publishers on existing packages.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=${RELEASE_REF#v}
          if npm view "@ahrara/sdk@$version" version >/dev/null 2>&1; then
            echo "@ahrara/sdk $version is already published"
            exit 0
          fi
          npm publish "packages/sdk-npm/ahrara-sdk-$version.tgz" --access public --provenance
  maven:
    needs: smoke
    runs-on: ubuntu-latest
    # Central Portal user token for dev.ahrara, and a GPG key whose public key is on a keyserver.
    environment: release
    env:
      RELEASE_REF: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: client-*
          path: dist
          merge-multiple: true
      - name: Stage the six native libraries
        run: make sdk-stage
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          version=${RELEASE_REF#v}
          if curl --fail --silent --head "https://repo1.maven.org/maven2/dev/ahrara/ahrara/$version/ahrara-$version.pom" >/dev/null; then
            echo "dev.ahrara:ahrara $version is already published"
            exit 0
          fi
          mvn -B -P release -DskipTests -f src/sdks/java/pom.xml deploy
  # The Go SDK downloads its native library from the release, so the module tag
  # must carry that release's checksums. They live in a commit outside main.
  go:
    needs: publish
    runs-on: ubuntu-latest
    # Module tags are permanent in the Go proxy, so they need the same approval as the release.
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_REF: ${{ inputs.version || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The runner image's Go provides gofmt and the module proxy check.
      - name: Tag the Go SDK and the k6 extension
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_REF#v}
          gh release download "v$version" --pattern 'ahrara-native-*' --dir native
          {
            printf '// Code generated by the release workflow. DO NOT EDIT.\n\npackage ahrara\n\nvar (\n'
            printf '\tnativeVersion = "%s"\n\tnativeSHA256 = map[string]string{\n' "$version"
            for file in native/*; do printf '\t\t"%s": "%s",\n' "${file##*/}" "$(sha256sum "$file" | cut -d ' ' -f 1)"; done
            printf '\t}\n)\n'
          } > src/sdks/go/native_checksums.go
          gofmt -w src/sdks/go/native_checksums.go
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m "Go SDK $version native library checksums" src/sdks/go/native_checksums.go
          for module in go k6; do
            tag="src/sdks/$module/v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists"
              continue
            fi
            git tag "$tag"
            git push origin "refs/tags/$tag"
          done
          # Have the public proxy fetch both modules now instead of on the first user's request.
          for module in go k6; do
            GOPROXY=https://proxy.golang.org go list -m "github.com/Hitmasu/Ahrara/src/sdks/$module@v$version"
          done
