[extend]
useDefault = true

# Historical vendored SQLite extension macros and FTS5 row identifiers.
# Keep this narrow allowlist for Git history after removing the local sources.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Upstream SQLite API macros and FTS5 row identifier"
condition = "AND"
regexTarget = "match"
paths = ['''(^|/)third_party/libsqlite3-sys/(sqlite3|sqlcipher)/sqlite3(ext\.h|\.c)$''']
regexes = [
  '''^sqlite3_api->(column_bytes16|soft_heap_limit64|hard_heap_limit64)\s*$''',
  '''^iKey==FTS5_AVERAGES_ROWID\s*$''',
]
