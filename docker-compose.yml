services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    user: "${AHRARA_UID:-1000}:${AHRARA_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    environment:
      AHRARA_UNIX_SOCKET: /run/ahrara/ahrara.sock
    ulimits:
      nofile: 1048576
    ports:
      - "127.0.0.1:${AHRARA_SMTP_PORT:-2525}:2525"
      - "127.0.0.1:${AHRARA_WSS_PORT:-8443}:8443"
    volumes:
      - ./.dev/certs/ca.pem:/certs/ca.pem:ro
      - ./.dev/certs/server.pem:/certs/server.pem:ro
      - ./.dev/certs/server-key.pem:/certs/server-key.pem:ro
      - ./.dev/certs/transport.key:/certs/transport.key:ro
      - type: bind
        source: ./.dev/run
        target: /run/ahrara
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, /ahrara-server, healthcheck]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    profiles: [tunnel]
    user: "${AHRARA_UID:-1000}:${AHRARA_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/tunnel_token]
    ulimits:
      nofile: 1048576
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./.dev/run
        target: /run/ahrara
        read_only: true
        bind:
          create_host_path: false
    secrets: [tunnel_token]

secrets:
  tunnel_token:
    file: ./.dev/cloudflared-token
