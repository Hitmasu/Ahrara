<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · Ahrara</title><link rel="icon" href="/assets/logo.png"><link rel="stylesheet" href="/assets/app.css"></head><body class="login-page"><main class="login"><a class="brand" href="/"><img src="/assets/logo.png" width="56" height="56" alt=""><span>Ahrara<small>Simple. Private. Yours.</small></span></a><h1>Your inbox, on your computer.</h1><p class="muted">Enter your Web Page password to continue.</p>{% if error %}<p role="alert" class="warning">Incorrect password. Please try again.</p>{% endif %}<form action="/login" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Password<input type="password" name="password" autocomplete="current-password" maxlength="1024" autofocus required></label><button class="button primary">Sign in</button></form><p class="login-footer">Forgot your password? Reset it from the Ahrara CLI.</p></main></body></html>
